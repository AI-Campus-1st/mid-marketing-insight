# 대시보드 화면 설정: 오른쪽 위 영어 메뉴(Deploy 등)를 줄인다
[client]
toolbarMode = "minimal"

[browser]
gatherUsageStats = false

# 코드를 고치면 화면을 저절로 다시 그린다 (새로고침 안 해도 됨)
[server]
runOnSave = true

# ── 테마 (design_test: docs/design/references 스타일) ─────────────────
# 흰 바탕 + 둥근 카드 + 회청색 테두리 + 파랑 강조. 강조색은 차트 팔레트(dashboard/theme.py)의 파랑과 같게
# 라이트·다크를 따로 정의 → 사용자가 설정에서 바꿔도 각 모드에 맞는 색
[theme]
font = "Pretendard:https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css, Apple SD Gothic Neo, Malgun Gothic, sans-serif"
headingFontWeights = [800, 700, 700, 700, 600, 600]
baseRadius = "0.75rem"
buttonRadius = "0.6rem"
showWidgetBorder = true
showSidebarBorder = true

[theme.light]
primaryColor = "#2a78d6"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f4f6fa"
textColor = "#1f2733"
borderColor = "#e4e8ef"
linkColor = "#2a78d6"
blueColor = "#2a78d6"
blueBackgroundColor = "#eef4fc"
dataframeHeaderBackgroundColor = "#f4f6fa"

[theme.light.sidebar]
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f4f6fa"
borderColor = "#e4e8ef"

[theme.dark]
primaryColor = "#3987e5"
backgroundColor = "#14161a"
secondaryBackgroundColor = "#1e2128"
textColor = "#eceef2"
borderColor = "#2d313a"
linkColor = "#6da7ec"
blueColor = "#3987e5"
blueBackgroundColor = "#1a2433"
dataframeHeaderBackgroundColor = "#1e2128"

[theme.dark.sidebar]
backgroundColor = "#17191e"
secondaryBackgroundColor = "#1e2128"
borderColor = "#2d313a"
